
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Impondo Imports no Controle</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <header class="header">
    <img src="logo.png" alt="Impondo Imports" class="logo" />
    <div class="header-title">
      <span class="brand">IMPONDO</span>
      <span class="sub">NO CONTROLE</span>
    </div>
  </header>

  <main id="app" class="app-content"></main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="dashboard">
      <span class="icon">🏠</span>
      <span class="label">Início</span>
    </button>
    <button class="nav-btn" data-screen="clientes">
      <span class="icon">👥</span>
      <span class="label">Clientes</span>
    </button>
    <button class="nav-btn" data-screen="prepedidos">
      <span class="icon">📝</span>
      <span class="label">Pré-pedidos</span>
    </button>
    <button class="nav-btn" data-screen="pedidos">
      <span class="icon">📦</span>
      <span class="label">Pedidos</span>
    </button>
    <button class="nav-btn" data-screen="estoque">
      <span class="icon">👕</span>
      <span class="label">Estoque</span>
    </button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="storage.js"></script>
  <script src="cálculos.js"></script>
  <script src="app.js"></script>
</body>
</html>
